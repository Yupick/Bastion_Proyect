name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de release a publicar (formato vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Resolver tag de release
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="${{ inputs.tag_name }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Tag invalido: $release_tag" >&2
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  build-docker-image:
    runs-on: ubuntu-latest
    needs: validate-tag
    outputs:
      image_name: ${{ steps.meta-vars.outputs.image_name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir metadatos base
        id: meta-vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner_lower="${REPOSITORY_OWNER,,}"
          image_name="ghcr.io/${owner_lower}/bastion-proyect-servidor"
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Preparar metadata Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta-vars.outputs.image_name }}
          tags: |
            type=raw,value=latest,enable=true
            type=raw,value=sha-${{ github.sha }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Qrypta Servidor
            org.opencontainers.image.description=Servidor FastAPI del monorepo Qrypta.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de imagen del servidor
        id: build
        uses: docker/build-push-action@v6
        with:
          context: qrypta
          file: qrypta/servidor/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen de publicacion Docker
        run: |
          {
            echo '## Docker publish servidor'
            echo ''
            echo "- Imagen: ${{ steps.meta-vars.outputs.image_name }}"
            echo "- Digest: ${{ steps.build.outputs.digest }}"
            echo ''
            echo '### Tags publicados'
            echo '${{ steps.meta.outputs.tags }}'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    runs-on: ubuntu-latest
    needs: [validate-tag, build-docker-image]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generar notas de release
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "${{ needs.validate-tag.outputs.release_tag }}^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            notes="$(git log --oneline --no-decorate "${previous_tag}..${{ needs.validate-tag.outputs.release_tag }}")"
          else
            notes="$(git log --oneline --no-decorate --max-count=50)"
          fi

          printf '%s\n' "$notes" > release-notes.md

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.release_tag }}
          name: ${{ needs.validate-tag.outputs.release_tag }}
          generate_release_notes: true
          body_path: release-notes.md

      - name: Añadir info Docker al release
        run: |
          {
            echo ''
            echo '---'
            echo ''
            echo '### 🐳 Imagen Docker'
            echo ''
            echo "\`\`\`bash"
            echo "docker pull ${{ needs.build-docker-image.outputs.image_name }}:${{ needs.validate-tag.outputs.release_tag }}"
            echo "\`\`\`"
            echo ''
            echo "**Digest:** \`${{ needs.build-docker-image.outputs.digest }}\`"
          } >> release-notes.md

      - name: Actualizar release con info Docker
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.release_tag }}
          body_path: release-notes.md
