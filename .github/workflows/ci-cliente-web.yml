name: CI Cliente Web

on:
  push:
    branches: [develop, main]
    paths:
      - 'qrypta/cliente_web/**'
      - '.github/workflows/ci-cliente-web.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'qrypta/cliente_web/**'
      - '.github/workflows/ci-cliente-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cliente-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qrypta/cliente_web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qrypta/cliente_web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm run test:run

  build-web:
    runs-on: ubuntu-latest
    needs: test-web
    defaults:
      run:
        working-directory: qrypta/cliente_web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qrypta/cliente_web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
