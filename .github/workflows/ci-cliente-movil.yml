name: CI Cliente Movil

on:
  push:
    branches: [develop, main]
    paths:
      - 'qrypta/cliente_movil/**'
      - '.github/workflows/ci-cliente-movil.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'qrypta/cliente_movil/**'
      - '.github/workflows/ci-cliente-movil.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cliente-movil-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qrypta/cliente_movil

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qrypta/cliente_movil

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android APK (debug)
        run: flutter build apk --debug

  ios-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: qrypta/cliente_movil

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS without codesign
        run: flutter build ios --no-codesign
