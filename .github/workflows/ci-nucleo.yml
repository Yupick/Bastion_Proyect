name: ci-nucleo

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-nucleo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-nucleo-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            qrypta/nucleo_crypto/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r qrypta/nucleo_crypto/requirements.txt

      - name: Crear carpeta de artefactos
        run: mkdir -p artifacts/test-results

      - name: Ejecutar tests base del nucleo (sin oqs)
        run: |
          pytest qrypta/nucleo_crypto/tests -q -m "not requires_oqs" --maxfail=1 --junitxml=artifacts/test-results/nucleo-core.xml

      - name: Publicar resultados de tests base
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-nucleo-core
          path: artifacts/test-results/nucleo-core.xml

  test-nucleo-oqs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            qrypta/nucleo_crypto/requirements.txt

      - name: Instalar dependencias base
        run: |
          python -m pip install --upgrade pip
          pip install -r qrypta/nucleo_crypto/requirements.txt

      - name: Instalar prerequisitos del sistema para liboqs
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config ninja-build libffi-dev git

      - name: Compilar e instalar liboqs desde fuente
        run: |
          git clone --depth 1 --branch main https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cd /tmp/liboqs
          mkdir build && cd build
          cmake -GNinja -DOQS_BUILD_ONLY_LIB=OFF -DCMAKE_INSTALL_PREFIX=/usr/local ..
          ninja
          sudo ninja install
          sudo ldconfig

      - name: Compilar e instalar binding Python oqs desde fuente
        run: |
          cd /tmp/liboqs/python
          pip install -e .

      - name: Verificar instalacion oqs
        run: |
          python -c "import oqs; print('KeyEncapsulation:', hasattr(oqs, 'KeyEncapsulation')); print('Signature:', hasattr(oqs, 'Signature'))"

      - name: Crear carpeta de artefactos
        run: mkdir -p artifacts/test-results

      - name: Ejecutar tests requires_oqs
        run: |
          pytest qrypta/nucleo_crypto/tests -q -m "requires_oqs" --maxfail=1 --junitxml=artifacts/test-results/nucleo-oqs.xml

      - name: Publicar resultados de tests oqs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-nucleo-oqs
          path: artifacts/test-results/nucleo-oqs.xml
