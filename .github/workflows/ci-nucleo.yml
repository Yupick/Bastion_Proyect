name: ci-nucleo

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-nucleo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-nucleo-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            qrypta/servidor/requirements.txt
            qrypta/servidor/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r qrypta/servidor/requirements-dev.txt

      - name: Crear carpeta de artefactos
        run: mkdir -p artifacts/test-results

      - name: Ejecutar tests base del nucleo (sin oqs)
        run: |
          pytest qrypta/nucleo_crypto/tests -q -m "not requires_oqs" --maxfail=1 --junitxml=artifacts/test-results/nucleo-core.xml

      - name: Publicar resultados de tests base
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-nucleo-core
          path: artifacts/test-results/nucleo-core.xml

  test-nucleo-oqs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            qrypta/servidor/requirements.txt
            qrypta/servidor/requirements-dev.txt

      - name: Instalar dependencias base
        run: |
          python -m pip install --upgrade pip
          pip install -r qrypta/servidor/requirements-dev.txt

      - name: Instalar prerequisitos del sistema para liboqs
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config ninja-build libffi-dev

      - name: Intentar instalar oqs
        run: |
          python -m pip install oqs || true

      - name: Crear carpeta de artefactos
        run: mkdir -p artifacts/test-results

      - name: Ejecutar tests requires_oqs si la libreria esta disponible
        run: |
          if python -c "import oqs" >/dev/null 2>&1; then
            echo "oqs detectado. Ejecutando tests requires_oqs."
            pytest qrypta/nucleo_crypto/tests -q -m "requires_oqs" --maxfail=1 --junitxml=artifacts/test-results/nucleo-oqs.xml
          else
            echo "oqs no disponible en el entorno CI. Se omite suite requires_oqs sin fallar pipeline."
            printf '<testsuite name="nucleo-oqs" tests="0" failures="0" skipped="0"></testsuite>\n' > artifacts/test-results/nucleo-oqs.xml
          fi

      - name: Publicar resultados de tests oqs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-nucleo-oqs
          path: artifacts/test-results/nucleo-oqs.xml
