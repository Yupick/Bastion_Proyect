name: ci-servidor

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-servidor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            qrypta/servidor/requirements.txt
            qrypta/servidor/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r qrypta/servidor/requirements-dev.txt

      - name: Crear carpeta de artefactos
        run: mkdir -p artifacts/test-results

      - name: Ejecutar tests del servidor
        run: |
          pytest qrypta/servidor/tests -q --maxfail=1 --junitxml=artifacts/test-results/servidor.xml

      - name: Publicar resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-servidor
          path: artifacts/test-results/servidor.xml
