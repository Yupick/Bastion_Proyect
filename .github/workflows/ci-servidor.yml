name: ci-servidor

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  test-servidor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps for liboqs
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config ninja-build libffi-dev

      - name: Try install Python binding 'oqs'
        run: |
          python -m pip install --upgrade pip
          python -m pip install oqs || echo "oqs install failed; tests that require it may fail"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r qrypta/servidor/requirements.txt

      - name: Ejecutar tests del servidor
        run: |
          pytest qrypta/servidor/tests -q
